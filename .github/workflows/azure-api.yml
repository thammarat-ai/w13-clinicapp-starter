# checkpoint step-02 — workflow deploy API → App Service
# หมายเหตุ: ของจริง Azure สร้างให้เองตอน Deployment Center (CP3.2)
# ไฟล์นี้คือ reference ที่สอนในคาบ + fallback ถ้าของ Azure สร้างผิด
# ── ต้องแก้ 2 จุด: app-name และ secret (ดูด้านล่าง) ──
name: Build and deploy clinic API to App Service

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/azure-api.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install + test (คาบ B จะเพิ่ม npm test ตรงนี้)
        working-directory: server
        run: |
          npm install
          npm test --if-present

      - name: Upload artifact (เฉพาะโฟลเดอร์ server — จุดที่ต้องแก้จากของ Azure!)
        uses: actions/upload-artifact@v4
        with:
          name: clinic-api
          path: server/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: clinic-api

      - name: Login to Azure
        uses: azure/login@v2
        with:
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          # ← แก้เป็นชื่อ App Service ของคุณ (จาก CP3.1)
          app-name: 'app-clinicapp-api-<username>'
          # ← secret นี้ Azure ตั้งให้เองตอนเชื่อม Deployment Center
          #   (Portal → App Service → Overview → Download publish profile
          #    → GitHub repo → Settings → Secrets → Actions)
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: .
